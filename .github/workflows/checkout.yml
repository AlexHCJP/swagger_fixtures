name: Dart

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  # publish.yml runs the same checks before it publishes.
  workflow_call:

jobs:
  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed -l 80 .

      - name: Analyze project source
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: dart test

      # The validation pub.dev runs on upload; fails on any warning.
      - name: Publish dry run
        run: dart pub publish --dry-run
